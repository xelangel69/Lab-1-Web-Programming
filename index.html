<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №1</title>
    <style>
        body {
            margin: 0;
            color: #222;
            background-color: #eeeeee;
            font-family: Arial, sans-serif;
        }

        #page-header {
            padding: 18px;
            color: white;
            background-color: #2f5d7c;
            font-family: Georgia, serif;
            font-size: 20px;
            text-align: center;
        }

        .content {
            width: 900px;
            max-width: calc(100% - 30px);
            margin: 25px auto;
        }

        .work-area,
        .results {
            padding: 20px;
            background-color: white;
            border: 1px solid #cccccc;
        }

        .graph-block,
        .form-block {
            display: inline-block;
            vertical-align: top;
        }

        .graph-block {
            width: 48%;
            text-align: center;
        }

        .form-block {
            width: 46%;
            margin-left: 4%;
        }

        .form-block > h1 {
            margin-top: 10px;
            font-size: 24px;
        }

        #plot {
            max-width: 100%;
            height: auto;
            border: 1px solid #999999;
        }

        .field {
            margin-bottom: 16px;
        }

        .field > label,
        .field > legend {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input[type="text"],
        select {
            box-sizing: border-box;
            width: 100%;
            padding: 8px;
            border: 1px solid #888888;
            font-size: 15px;
        }

        fieldset.field {
            padding: 0;
            border: 0;
        }

        .radius-options > label {
            display: inline-block;
            margin-right: 8px;
            padding: 5px;
        }

        #errors {
            min-height: 20px;
            margin-bottom: 10px;
            color: #b00020;
        }

        #errors:not(:empty)::before {
            content: "Ошибка: ";
            font-weight: bold;
        }

        button {
            padding: 9px 15px;
            border: 1px solid #24485f;
            color: white;
            background-color: #2f5d7c;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background-color: #24485f;
        }

        .results {
            margin-top: 20px;
        }

        .results h2 {
            display: inline-block;
            margin: 0 20px 15px 0;
        }

        #clear-results {
            color: #222;
            background-color: #dddddd;
            border-color: #999999;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 9px;
            border: 1px solid #aaaaaa;
            text-align: center;
        }

        thead > tr {
            background-color: #dbe8f0;
        }

        td[data-hit="true"] {
            color: green;
        }

        td[data-hit="false"] {
            color: #b00020;
        }
    </style>
</head>
<body>
    <header id="page-header">
        Лабораторная работа №1 - Кириллов Иван Александрович - Р3107 - Вариант №12619
    </header>

    <main class="content">
        <section class="work-area">
            <div class="graph-block">
                <canvas id="plot" width="420" height="420">
                    Ваш браузер не поддерживает Canvas.
                </canvas>
            </div>

            <form id="point-form" class="form-block" novalidate>
                <h1>Проверка точки</h1>

                <div class="field">
                    <label for="x-value">Координата X</label>
                    <select id="x-value" name="x">
                        <option value="">Выберите X</option>
                        <option value="-4">-4</option>
                        <option value="-3">-3</option>
                        <option value="-2">-2</option>
                        <option value="-1">-1</option>
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>

                <div class="field">
                    <label for="y-value">Координата Y</label>
                    <input id="y-value" name="y" type="text" placeholder="Число от -5 до 5">
                </div>

                <fieldset class="field">
                    <legend>Радиус R</legend>
                    <div class="radius-options">
                        <label><input type="checkbox" name="r" value="1"> 1</label>
                        <label><input type="checkbox" name="r" value="2"> 2</label>
                        <label><input type="checkbox" name="r" value="3"> 3</label>
                        <label><input type="checkbox" name="r" value="4"> 4</label>
                        <label><input type="checkbox" name="r" value="5"> 5</label>
                    </div>
                </fieldset>

                <div id="errors"></div>
                <button type="submit">Проверить</button>
            </form>
        </section>

        <section class="results">
            <h2>Результаты</h2>
            <button id="clear-results" type="button">Очистить</button>

            <table>
                <thead>
                    <tr>
                        <th>X</th>
                        <th>Y</th>
                        <th>R</th>
                        <th>Результат</th>
                        <th>Дата и время</th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
